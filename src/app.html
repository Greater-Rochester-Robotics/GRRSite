<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />

		<meta
			name="keywords"
			content="FRC, FIRST, 340, GRR, G.R.R., Greater Rochester Robotics, Robotics, Churchville, Chili, Rochester, New York, NY, Finger Lakes, Team, NYSFIRST, NYFIRST, FIRSTNY"
		/>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="theme-color" content="#e87722" />

		<link rel="preload" href="/fonts/InterVariable.woff2" as="font" type="font/woff2" />
		<link rel="preload" href="/fonts/InterVariable-Italic.woff2" as="font" type="font/woff2" />

		%sveltekit.head%

		<style>
			@font-face {
				font-family: Inter;
				font-style: normal;
				font-weight: 100 900;
				font-display: swap;
				src: url('/fonts/InterVariable.woff2') format('woff2');
			}
			@font-face {
				font-family: Inter;
				font-style: italic;
				font-weight: 100 900;
				font-display: swap;
				src: url('/fonts/InterVariable-Italic.woff2') format('woff2');
			}

			:root {
				--default-text: rgb(212, 212, 218);
				--accent: rgb(232, 119, 34);

				color: var(--default-text);
				background-color: rgb(28, 28, 30);

				font-family: Inter, sans-serif;
				font-feature-settings:
					'liga' 1,
					'calt' 1;
				text-rendering: optimizeLegibility;
				-webkit-font-smoothing: antialiased;
				-webkit-text-size-adjust: 100%;
				-moz-osx-font-smoothing: grayscale;
			}
		</style>

		<link rel="icon" type="image/x-icon" sizes="96x96" href="/favicon/favicon.ico" />

		<link rel="icon" type="image/png" sizes="114x114" href="/favicon/114x114.png" />
		<link rel="icon" type="image/png" sizes="128x128" href="/favicon/128x128.png" />
		<link rel="icon" type="image/png" sizes="152x152" href="/favicon/152x152.png" />
		<link rel="icon" type="image/png" sizes="167x167" href="/favicon/167x167.png" />
		<link rel="icon" type="image/png" sizes="180x180" href="/favicon/180x180.png" />
		<link rel="icon" type="image/png" sizes="192x192" href="/favicon/192x192.png" />
		<link rel="icon" type="image/png" sizes="256x256" href="/favicon/256x256.png" />

		<link rel="apple-touch-icon" type="image/png" sizes="114x114" href="/favicon/114x114.png" />
		<link rel="apple-touch-icon" type="image/png" sizes="128x128" href="/favicon/128x128.png" />
		<link rel="apple-touch-icon" type="image/png" sizes="152x152" href="/favicon/152x152.png" />
		<link rel="apple-touch-icon" type="image/png" sizes="167x167" href="/favicon/167x167.png" />
		<link rel="apple-touch-icon" type="image/png" sizes="180x180" href="/favicon/180x180.png" />
		<link rel="apple-touch-icon" type="image/png" sizes="192x192" href="/favicon/192x192.png" />
		<link rel="apple-touch-icon" type="image/png" sizes="256x256" href="/favicon/256x256.png" />
	</head>

	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
